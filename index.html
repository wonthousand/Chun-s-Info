<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>천준혁 | 자기소개</title>
  <!-- Pretendard는 Google Fonts에 없어 jsDelivr CDN으로 로드 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg-start: #F8FAFC;
      --bg-end: #E0F2FE;
      --accent: #0EA5E9;
      --accent-soft: rgba(14, 165, 233, 0.1);
      --text: #1E293B;
      --text-muted: #64748B;
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-border: rgba(255, 255, 255, 0.8);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      -webkit-font-smoothing: antialiased;
    }

    /* 배경에 떠다니는 공 */
    .balls {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .ball {
      position: absolute;
      line-height: 1;
      opacity: var(--opacity, 0.25);
      animation: float var(--duration, 20s) ease-in-out var(--delay, 0s) infinite alternate;
      will-change: transform;
      user-select: none;
    }

    @keyframes float {
      from {
        transform: translate(0, 0) rotate(0deg);
      }
      to {
        transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ball {
        animation: none;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.04),
        0 12px 40px rgba(14, 165, 233, 0.12);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 2px 4px rgba(15, 23, 42, 0.04),
        0 20px 50px rgba(14, 165, 233, 0.2);
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #38BDF8 0%, var(--accent) 100%);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.35);
      margin-bottom: 20px;
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .tags {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .tag {
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(14, 165, 233, 0.2);
      cursor: default;
      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--i, 0) * 80ms);
    }

    /* 카드 호버 시 태그가 왼쪽부터 순서대로 살짝 떠오름 */
    .card:hover .tag {
      transform: translateY(-4px);
    }

    .tag:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .socials {
      display: flex;
      justify-content: center;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: var(--text);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .social-btn:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }

    .social-btn:focus-visible,
    .tag:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 24px;
        border-radius: 20px;
      }

      .avatar {
        width: 76px;
        height: 76px;
        font-size: 28px;
      }

      .name {
        font-size: 24px;
      }

      .bio {
        font-size: 15px;
      }

      .social-btn {
        width: 100%;
        justify-content: center;
      }

      .socials {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="balls" aria-hidden="true"></div>

  <main class="card">
    <div class="avatar" aria-hidden="true">JH</div>
    <h1 class="name">천준혁</h1>
    <p class="bio">축구와 테니스 등 운동을 좋아합니다.</p>

    <ul class="tags" aria-label="관심사">
      <li class="tag" style="--i: 0">축구</li>
      <li class="tag" style="--i: 1">테니스</li>
      <li class="tag" style="--i: 2">수영</li>
    </ul>

    <nav class="socials" aria-label="소셜 링크">
      <a class="social-btn" href="https://www.instagram.com/jun__hyeock/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
        </svg>
        Instagram
      </a>
    </nav>
  </main>

  <script>
    // 축구공 15개 + 테니스공 15개를 무작위 위치·크기·속도로 생성
    (function () {
      const container = document.querySelector(".balls");
      const types = [...Array(15).fill("⚽"), ...Array(15).fill("🎾")];
      const rand = (min, max) => Math.random() * (max - min) + min;

      types.forEach((emoji) => {
        const ball = document.createElement("span");
        ball.className = "ball";
        ball.textContent = emoji;
        ball.style.left = rand(0, 95) + "%";
        ball.style.top = rand(0, 95) + "%";
        ball.style.fontSize = rand(14, 28) + "px";
        ball.style.setProperty("--opacity", rand(0.15, 0.35).toFixed(2));
        ball.style.setProperty("--duration", rand(14, 28).toFixed(1) + "s");
        ball.style.setProperty("--delay", -rand(0, 20).toFixed(1) + "s");
        ball.style.setProperty("--dx", rand(-80, 80).toFixed(0) + "px");
        ball.style.setProperty("--dy", rand(-80, 80).toFixed(0) + "px");
        ball.style.setProperty("--rot", rand(-180, 180).toFixed(0) + "deg");
        container.appendChild(ball);
      });
    })();
  </script>
</body>
</html>
